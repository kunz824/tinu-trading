<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tinu-Trading</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #10141b;
    --bg-panel: #171d27;
    --border: #262f3d;
    --text: #e7e6e2;
    --text-dim: #8b93a3;
    --accent: #d4a24e;
    --pos: #4caf7d;
    --neg: #e0605a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 20px 20px 0;
  }
  h1 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .stand {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 18px;
  }
  nav {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  nav button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 15px;
    font-family: inherit;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button.aktiv {
    color: var(--text);
    border-bottom: 2px solid var(--accent);
  }
  main {
    padding: 20px;
    max-width: 640px;
    margin: 0 auto;
  }
  .register { display: none; }
  .register.aktiv { display: block; }

  .hero {
    padding: 22px 0 26px;
  }
  .hero .label {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 6px;
  }
  .hero .zahl {
    font-size: 40px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .stats-reihe {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat {
    flex: 1;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat .label {
    color: var(--text-dim);
    font-size: 12px;
    margin: 0 0 4px;
  }
  .stat .zahl {
    font-size: 20px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  h2 {
    font-size: 14px;
    color: var(--text-dim);
    font-weight: 500;
    margin: 0 0 10px;
  }

  .kreisdiagramm-zeile {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 16px;
  }
  #kreisdiagramm { flex-shrink: 0; }
  .legende {
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 13px;
  }
  .legende-eintrag {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .legende-punkt {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legende-eintrag .anzahl { color: var(--text-dim); }
  .kreisdiagramm-leer {
    color: var(--text-dim);
    font-size: 13px;
  }

  .legende-balken {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 14px;
    margin: 8px 0 4px;
  }

  .system-liste {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .system-zeile {
    background: var(--bg-panel);
    padding: 13px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .system-name { font-size: 14px; }
  .system-name .anzahl { color: var(--text-dim); font-size: 12px; margin-left: 6px; }
  .system-zeile .zahl {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 14px;
  }

  .pos { color: var(--pos); }
  .neg { color: var(--neg); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    color: var(--text-dim);
    font-weight: 500;
    padding: 0 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  th.zahl-spalte, td.zahl-spalte { text-align: right; }
  td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  td.richtung-buy { color: var(--pos); }
  td.richtung-sell { color: var(--neg); }

  .leer {
    color: var(--text-dim);
    font-size: 14px;
    padding: 30px 0;
    text-align: center;
  }
  .fehler {
    color: var(--neg);
    font-size: 13px;
    padding: 16px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>Tinu-Trading</h1>
  <p class="stand" id="standZeit">Lädt…</p>
  <nav>
    <button class="aktiv" data-register="kontostand">Kontostand</button>
    <button data-register="trades">Aktuelle Trades</button>
  </nav>
</header>

<main>
  <section id="register-kontostand" class="register aktiv">
    <div class="hero">
      <p class="label">Kontostand</p>
      <p class="zahl" id="kontostand">–</p>
    </div>
    <div class="stats-reihe">
      <div class="stat">
        <p class="label">Tages-PnL</p>
        <p class="zahl" id="tagesPnl">–</p>
      </div>
      <div class="stat">
        <p class="label">Wochen-PnL</p>
        <p class="zahl" id="wochenPnl">–</p>
      </div>
    </div>

    <h2 id="kreisdiagrammTitel">Heutige Ergebnisse je Handelsvariante</h2>
    <div class="kreisdiagramm-zeile" id="kreisdiagrammZeile">
      <svg id="kreisdiagramm" viewBox="0 0 120 120" width="120" height="120"></svg>
      <div class="legende" id="legende"></div>
    </div>

    <h2 style="margin-top:24px;">Wochenverlauf je Handelsvariante</h2>
    <svg id="balkendiagramm" viewBox="0 0 600 230" width="100%" height="200"></svg>
    <div class="legende legende-balken" id="legendeBalken"></div>
    <p class="kreisdiagramm-leer" style="margin-top:2px;">Auf einen Tag klicken, um ihn oben im Kreisdiagramm anzuzeigen.</p>

    <h2 style="margin-top:24px;">Offene Positionen je Handelsvariante</h2>
    <div class="system-liste" id="systemListe"></div>
  </section>

  <section id="register-trades" class="register">
    <table>
      <thead>
        <tr>
          <th>System</th>
          <th>Symbol</th>
          <th>Richtung</th>
          <th class="zahl-spalte">Lot</th>
          <th class="zahl-spalte">P/L</th>
        </tr>
      </thead>
      <tbody id="tradesTabelle"></tbody>
    </table>
    <p class="leer" id="tradesLeer" style="display:none;">Keine offenen Positionen.</p>
  </section>
</main>

<script>
// ── Konfiguration ─────────────────────────────────────────────────────
// Hier die eigenen JSONBin-Zugangsdaten eintragen (siehe Anleitung).
const BIN_ID = "6aa44985ac6210605ac1c64a";
// WICHTIG: Hier NUR einen Nur-Lese-"Access Key" eintragen, NICHT den
// Master-Key — dieser Code liegt in einem öffentlichen Repository, der
// Master-Key hätte Schreib-/Löschzugriff auf ALLE Bins im Konto.
const ACCESS_KEY = "$2a$10$cxxzLQ0Keh0XA2AVA3A4E.JQuGVPIGKPI8tZsPx40RqkHfsDZ3IC2";
const AKTUALISIERUNG_SEKUNDEN = 90;

const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

function formatZahlCH(wert, nachkomma = 2) {
  const teile = Math.abs(wert).toFixed(nachkomma).split(".");
  teile[0] = teile[0].replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  return teile.join(".");
}

function formatEUR(wert) {
  const vz = wert >= 0 ? "+" : "−";
  return `${vz}${formatZahlCH(wert)} EUR`;
}

function setZahl(el, wert, mitVorzeichen) {
  el.textContent = mitVorzeichen ? formatEUR(wert) : `${formatZahlCH(wert)} EUR`;
  el.classList.remove("pos", "neg");
  if (mitVorzeichen) el.classList.add(wert >= 0 ? "pos" : "neg");
}

async function ladeStatus() {
  try {
    const antwort = await fetch(JSONBIN_URL, {
      headers: { "X-Access-Key": ACCESS_KEY }
    });
    if (!antwort.ok) throw new Error(`HTTP ${antwort.status}`);
    const daten = (await antwort.json()).record;
    zeigeStatus(daten);
  } catch (fehler) {
    document.getElementById("standZeit").textContent =
      "Daten konnten nicht geladen werden — läuft der Portfolio-Koordinator?";
    console.error(fehler);
  }
}

function zeigeStatus(daten) {
  const zeit = new Date(daten.zeitstempel).toLocaleTimeString("de-CH");
  document.getElementById("standZeit").textContent = `Stand: ${zeit} Uhr`;

  document.getElementById("kontostand").textContent =
    `${formatZahlCH(daten.kontostand)} EUR`;
  setZahl(document.getElementById("tagesPnl"), daten.tages_pnl, true);
  setZahl(document.getElementById("wochenPnl"), daten.wochen_pnl, true);

  const systemListe = document.getElementById("systemListe");
  systemListe.innerHTML = "";
  const tradesTabelle = document.getElementById("tradesTabelle");
  tradesTabelle.innerHTML = "";
  let gesamtTrades = 0;
  const kreisdiagrammDaten = [];

  for (const [system, positionen] of Object.entries(daten.positionen_je_system || {})) {
    if (system === "Unbekannt" && positionen.length === 0) continue;

    const summe = positionen.reduce((s, p) => s + p.profit, 0);
    const zeile = document.createElement("div");
    zeile.className = "system-zeile";
    zeile.innerHTML = `
      <span class="system-name">${system}<span class="anzahl">${positionen.length} offen</span></span>
      <span class="zahl ${summe >= 0 ? "pos" : "neg"}">${formatEUR(summe)}</span>
    `;
    systemListe.appendChild(zeile);
    if (positionen.length > 0) {
      kreisdiagrammDaten.push({ system, anzahl: positionen.length });
    }

    for (const p of positionen) {
      gesamtTrades++;
      const richtungKlasse = p.richtung === "BUY" ? "richtung-buy" : "richtung-sell";
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${system}</td>
        <td>${p.symbol}</td>
        <td class="${richtungKlasse}">${p.richtung}</td>
        <td class="zahl-spalte">${p.lot.toFixed(2)}</td>
        <td class="zahl-spalte ${p.profit >= 0 ? "pos" : "neg"}">${formatEUR(p.profit)}</td>
      `;
      tradesTabelle.appendChild(tr);
    }
  }

  document.getElementById("tradesLeer").style.display =
    gesamtTrades === 0 ? "block" : "none";

  wochenVerlauf = daten.taegliche_ergebnisse_je_system || [];
  if (!wochenVerlauf.some(t => t.datum === ausgewaehltesDatum)) {
    ausgewaehltesDatum = wochenVerlauf.length
      ? wochenVerlauf[wochenVerlauf.length - 1].datum
      : null;
  }
  aktualisiereDiagramme();
}

let wochenVerlauf = [];
let ausgewaehltesDatum = null;

function aktualisiereDiagramme() {
  const eintrag = wochenVerlauf.find(t => t.datum === ausgewaehltesDatum);
  const heute = new Date().toISOString().slice(0, 10);
  const titel = document.getElementById("kreisdiagrammTitel");
  if (eintrag) {
    const datumLesbar = new Date(eintrag.datum + "T00:00:00")
      .toLocaleDateString("de-CH", { weekday: "short", day: "2-digit", month: "2-digit" });
    titel.textContent = eintrag.datum === heute
      ? "Heutige Ergebnisse je Handelsvariante"
      : `Ergebnisse ${datumLesbar} je Handelsvariante`;
  }
  zeichneKreisdiagramm(eintrag);
  zeichneBalkendiagramm(wochenVerlauf);
}

// ── Kreisdiagramm: Ergebnisse eines Tages je System (reines SVG) ─────
const SYSTEM_FARBEN = {
  CopyTrading: "#d4a24e",
  CopyTradingEnhanced: "#5aa9bb",
  CopyTradingPlatinum: "#9b8ad1",
  TinuAgents: "#4caf7d",
  Unbekannt: "#5a6270",
};

function zeichneKreisdiagramm(tagEintrag) {
  const svg = document.getElementById("kreisdiagramm");
  const legende = document.getElementById("legende");
  svg.innerHTML = "";
  legende.innerHTML = "";

  const systeme = Object.keys(SYSTEM_FARBEN).filter(s => s !== "Unbekannt");
  const werte = tagEintrag
    ? systeme.map(system => ({ system, wert: tagEintrag[system] || 0 }))
    : systeme.map(system => ({ system, wert: 0 }));

  const gesamtAbs = werte.reduce((s, e) => s + Math.abs(e.wert), 0);
  if (gesamtAbs === 0) {
    const hinweis = document.createElement("p");
    hinweis.className = "kreisdiagramm-leer";
    hinweis.textContent = "Noch keine abgeschlossenen Trades an diesem Tag.";
    legende.appendChild(hinweis);
    return;
  }

  const radius = 50, mitte = 60, strichbreite = 16;
  const umfang = 2 * Math.PI * radius;
  let bisherigerAnteil = 0;

  for (const { system, wert } of werte) {
    if (wert === 0) continue;
    const anteil = Math.abs(wert) / gesamtAbs;
    const segmentLaenge = anteil * umfang;
    const kreis = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    kreis.setAttribute("cx", mitte);
    kreis.setAttribute("cy", mitte);
    kreis.setAttribute("r", radius);
    kreis.setAttribute("fill", "none");
    kreis.setAttribute("stroke", SYSTEM_FARBEN[system]);
    kreis.setAttribute("stroke-width", strichbreite);
    kreis.setAttribute("stroke-opacity", wert >= 0 ? "1" : "0.45");
    kreis.setAttribute("stroke-dasharray", `${segmentLaenge} ${umfang - segmentLaenge}`);
    kreis.setAttribute("stroke-dashoffset", -bisherigerAnteil * umfang);
    kreis.setAttribute("transform", `rotate(-90 ${mitte} ${mitte})`);
    svg.appendChild(kreis);
    bisherigerAnteil += anteil;

    const eintrag = document.createElement("div");
    eintrag.className = "legende-eintrag";
    eintrag.innerHTML = `
      <span class="legende-punkt" style="background:${SYSTEM_FARBEN[system]}"></span>
      <span>${system}</span>
      <span class="${wert >= 0 ? "pos" : "neg"}">${formatEUR(wert)}</span>
    `;
    legende.appendChild(eintrag);
  }
}

// ── Balkendiagramm: Wochenverlauf je System (reines SVG) ─────────────
function zeichneBalkendiagramm(verlauf) {
  const svg = document.getElementById("balkendiagramm");
  const legende = document.getElementById("legendeBalken");
  svg.innerHTML = "";
  legende.innerHTML = "";

  const systeme = Object.keys(SYSTEM_FARBEN).filter(s => s !== "Unbekannt");
  for (const system of systeme) {
    const eintrag = document.createElement("div");
    eintrag.className = "legende-eintrag";
    eintrag.innerHTML = `
      <span class="legende-punkt" style="background:${SYSTEM_FARBEN[system]}"></span>
      <span>${system}</span>
    `;
    legende.appendChild(eintrag);
  }

  if (!verlauf.length) return;

  const breite = 600, hoehe = 230, nullLinieY = 115;
  const maxAbs = Math.max(
    1, ...verlauf.flatMap(tag => systeme.map(s => Math.abs(tag[s] || 0)))
  );
  const halbeHoehe = 95; // Platz nach oben/unten ab der Null-Linie
  const tagBreite = breite / verlauf.length;
  const balkenBreite = (tagBreite - 12) / systeme.length;

  // Null-Linie
  const nulllinie = document.createElementNS("http://www.w3.org/2000/svg", "line");
  nulllinie.setAttribute("x1", 0);
  nulllinie.setAttribute("x2", breite);
  nulllinie.setAttribute("y1", nullLinieY);
  nulllinie.setAttribute("y2", nullLinieY);
  nulllinie.setAttribute("stroke", "#262f3d");
  svg.appendChild(nulllinie);

  verlauf.forEach((tag, i) => {
    const gruppeX = i * tagBreite + 6;
    const istAusgewaehlt = tag.datum === ausgewaehltesDatum;

    // Klickbarer Hintergrundbereich für die ganze Tagesgruppe
    const klickflaeche = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    klickflaeche.setAttribute("x", i * tagBreite);
    klickflaeche.setAttribute("y", 0);
    klickflaeche.setAttribute("width", tagBreite);
    klickflaeche.setAttribute("height", hoehe);
    klickflaeche.setAttribute("fill", istAusgewaehlt ? "#1c2431" : "transparent");
    klickflaeche.style.cursor = "pointer";
    klickflaeche.addEventListener("click", () => {
      ausgewaehltesDatum = tag.datum;
      aktualisiereDiagramme();
    });
    svg.appendChild(klickflaeche);

    systeme.forEach((system, j) => {
      const wert = tag[system] || 0;
      const balkenHoehe = (Math.abs(wert) / maxAbs) * halbeHoehe;
      const x = gruppeX + j * balkenBreite;
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", x);
      rect.setAttribute("width", Math.max(balkenBreite - 2, 1));
      rect.setAttribute("fill", SYSTEM_FARBEN[system]);
      rect.style.pointerEvents = "none";
      if (wert >= 0) {
        rect.setAttribute("y", nullLinieY - balkenHoehe);
        rect.setAttribute("height", balkenHoehe);
      } else {
        rect.setAttribute("y", nullLinieY);
        rect.setAttribute("height", balkenHoehe);
      }
      svg.appendChild(rect);
    });

    // Tageslabel (Wochentag, kurz)
    const datum = new Date(tag.datum + "T00:00:00");
    const label = datum.toLocaleDateString("de-CH", { weekday: "short" });
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", gruppeX + (tagBreite - 12) / 2);
    text.setAttribute("y", hoehe - 6);
    text.setAttribute("fill", istAusgewaehlt ? "#e7e6e2" : "#8b93a3");
    text.setAttribute("font-size", "12");
    text.setAttribute("font-weight", istAusgewaehlt ? "700" : "400");
    text.setAttribute("text-anchor", "middle");
    text.style.pointerEvents = "none";
    text.textContent = label;
    svg.appendChild(text);
  });
}

// ── Register-Umschaltung ─────────────────────────────────────────────
document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("aktiv"));
    document.querySelectorAll(".register").forEach(r => r.classList.remove("aktiv"));
    btn.classList.add("aktiv");
    document.getElementById(`register-${btn.dataset.register}`).classList.add("aktiv");
  });
});

ladeStatus();
setInterval(ladeStatus, AKTUALISIERUNG_SEKUNDEN * 1000);
</script>

</body>
</html>
