<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tinu-Trading</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #10141b;
    --bg-panel: #171d27;
    --border: #262f3d;
    --text: #e7e6e2;
    --text-dim: #8b93a3;
    --accent: #d4a24e;
    --pos: #4caf7d;
    --neg: #e0605a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 20px 20px 0;
  }
  h1 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .stand {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 18px;
  }
  nav {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  nav button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 15px;
    font-family: inherit;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button.aktiv {
    color: var(--text);
    border-bottom: 2px solid var(--accent);
  }
  main {
    padding: 20px;
    max-width: 640px;
    margin: 0 auto;
  }
  .register { display: none; }
  .register.aktiv { display: block; }

  .hero {
    padding: 22px 0 26px;
  }
  .hero .label {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 6px;
  }
  .hero .zahl {
    font-size: 40px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .stats-reihe {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat {
    flex: 1;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat .label {
    color: var(--text-dim);
    font-size: 12px;
    margin: 0 0 4px;
  }
  .stat .zahl {
    font-size: 20px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  h2 {
    font-size: 14px;
    color: var(--text-dim);
    font-weight: 500;
    margin: 0 0 10px;
  }

  .system-liste {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .system-zeile {
    background: var(--bg-panel);
    padding: 13px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .system-name { font-size: 14px; }
  .system-name .anzahl { color: var(--text-dim); font-size: 12px; margin-left: 6px; }
  .system-zeile .zahl {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 14px;
  }

  .pos { color: var(--pos); }
  .neg { color: var(--neg); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    color: var(--text-dim);
    font-weight: 500;
    padding: 0 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  th.zahl-spalte, td.zahl-spalte { text-align: right; }
  td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  td.richtung-buy { color: var(--pos); }
  td.richtung-sell { color: var(--neg); }

  .leer {
    color: var(--text-dim);
    font-size: 14px;
    padding: 30px 0;
    text-align: center;
  }
  .fehler {
    color: var(--neg);
    font-size: 13px;
    padding: 16px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>Tinu-Trading</h1>
  <p class="stand" id="standZeit">Lädt…</p>
  <nav>
    <button class="aktiv" data-register="kontostand">Kontostand</button>
    <button data-register="trades">Aktuelle Trades</button>
  </nav>
</header>

<main>
  <section id="register-kontostand" class="register aktiv">
    <div class="hero">
      <p class="label">Kontostand</p>
      <p class="zahl" id="kontostand">–</p>
    </div>
    <div class="stats-reihe">
      <div class="stat">
        <p class="label">Tages-PnL</p>
        <p class="zahl" id="tagesPnl">–</p>
      </div>
      <div class="stat">
        <p class="label">Wochen-PnL</p>
        <p class="zahl" id="wochenPnl">–</p>
      </div>
    </div>
    <h2>Je Handelsvariante (offene Positionen)</h2>
    <div class="system-liste" id="systemListe"></div>
  </section>

  <section id="register-trades" class="register">
    <table>
      <thead>
        <tr>
          <th>System</th>
          <th>Symbol</th>
          <th>Richtung</th>
          <th class="zahl-spalte">Lot</th>
          <th class="zahl-spalte">P/L</th>
        </tr>
      </thead>
      <tbody id="tradesTabelle"></tbody>
    </table>
    <p class="leer" id="tradesLeer" style="display:none;">Keine offenen Positionen.</p>
  </section>
</main>

<script>
// ── Konfiguration ─────────────────────────────────────────────────────
// Hier die eigenen JSONBin-Zugangsdaten eintragen (siehe Anleitung).
const BIN_ID = "6aa44985ac6210605ac1c64a";
// WICHTIG: Hier NUR einen Nur-Lese-"Access Key" eintragen, NICHT den
// Master-Key — dieser Code liegt in einem öffentlichen Repository, der
// Master-Key hätte Schreib-/Löschzugriff auf ALLE Bins im Konto.
const ACCESS_KEY = "$2a$10$cxxzLQ0Keh0XA2AVA3A4E.JQuGVPIGKPI8tZsPx40RqkHfsDZ3IC2";
const AKTUALISIERUNG_SEKUNDEN = 90;

const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

function formatEUR(wert) {
  const vz = wert >= 0 ? "+" : "−";
  return `${vz}${Math.abs(wert).toFixed(2)} EUR`;
}

function setZahl(el, wert, mitVorzeichen) {
  el.textContent = mitVorzeichen ? formatEUR(wert) : `${wert.toFixed(2)} EUR`;
  el.classList.remove("pos", "neg");
  if (mitVorzeichen) el.classList.add(wert >= 0 ? "pos" : "neg");
}

async function ladeStatus() {
  try {
    const antwort = await fetch(JSONBIN_URL, {
      headers: { "X-Access-Key": ACCESS_KEY }
    });
    if (!antwort.ok) throw new Error(`HTTP ${antwort.status}`);
    const daten = (await antwort.json()).record;
    zeigeStatus(daten);
  } catch (fehler) {
    document.getElementById("standZeit").textContent =
      "Daten konnten nicht geladen werden — läuft der Portfolio-Koordinator?";
    console.error(fehler);
  }
}

function zeigeStatus(daten) {
  const zeit = new Date(daten.zeitstempel).toLocaleTimeString("de-CH");
  document.getElementById("standZeit").textContent = `Stand: ${zeit} Uhr`;

  document.getElementById("kontostand").textContent =
    `${daten.kontostand.toFixed(2)} EUR`;
  setZahl(document.getElementById("tagesPnl"), daten.tages_pnl, true);
  setZahl(document.getElementById("wochenPnl"), daten.wochen_pnl, true);

  const systemListe = document.getElementById("systemListe");
  systemListe.innerHTML = "";
  const tradesTabelle = document.getElementById("tradesTabelle");
  tradesTabelle.innerHTML = "";
  let gesamtTrades = 0;

  for (const [system, positionen] of Object.entries(daten.positionen_je_system || {})) {
    if (system === "Unbekannt" && positionen.length === 0) continue;

    const summe = positionen.reduce((s, p) => s + p.profit, 0);
    const zeile = document.createElement("div");
    zeile.className = "system-zeile";
    zeile.innerHTML = `
      <span class="system-name">${system}<span class="anzahl">${positionen.length} offen</span></span>
      <span class="zahl ${summe >= 0 ? "pos" : "neg"}">${formatEUR(summe)}</span>
    `;
    systemListe.appendChild(zeile);

    for (const p of positionen) {
      gesamtTrades++;
      const richtungKlasse = p.richtung === "BUY" ? "richtung-buy" : "richtung-sell";
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${system}</td>
        <td>${p.symbol}</td>
        <td class="${richtungKlasse}">${p.richtung}</td>
        <td class="zahl-spalte">${p.lot.toFixed(2)}</td>
        <td class="zahl-spalte ${p.profit >= 0 ? "pos" : "neg"}">${formatEUR(p.profit)}</td>
      `;
      tradesTabelle.appendChild(tr);
    }
  }

  document.getElementById("tradesLeer").style.display =
    gesamtTrades === 0 ? "block" : "none";
}

// ── Register-Umschaltung ─────────────────────────────────────────────
document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("aktiv"));
    document.querySelectorAll(".register").forEach(r => r.classList.remove("aktiv"));
    btn.classList.add("aktiv");
    document.getElementById(`register-${btn.dataset.register}`).classList.add("aktiv");
  });
});

ladeStatus();
setInterval(ladeStatus, AKTUALISIERUNG_SEKUNDEN * 1000);
</script>

</body>
</html>
